<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PatchHarbor Admin</title>
  <style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17251f;background:#f4f7f3}body{max-width:1100px;margin:0 auto;padding:28px 20px}header{display:flex;justify-content:space-between;align-items:start;border-bottom:1px solid #dce6dc;padding-bottom:20px}h1,h2{letter-spacing:-.04em}.eyebrow{color:#167653;font-size:.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.panel{background:#fff;border:1px solid #dce6dc;border-radius:14px;padding:20px;margin-top:20px}input,textarea,select{width:100%;box-sizing:border-box;border:1px solid #c9d8cb;border-radius:8px;padding:10px;font:inherit;margin:6px 0 12px}textarea{min-height:70px}button{background:#167653;color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer;margin:4px 4px 4px 0}.secondary{background:#e4f1e7;color:#145e43}.danger{background:#8a3d36}.muted{color:#68776e;font-size:.85rem}.report{border-top:1px solid #e1e9e1;padding:16px 0}.report:first-child{border-top:0}.pill{display:inline-block;background:#e4f1e7;color:#145e43;border-radius:99px;padding:3px 8px;font-size:.75rem;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style>
</head>
<body>
  <header><div><p class="eyebrow">PatchHarbor / private console</p><h1>Moderator dashboard</h1><p class="muted">Keys are held only in this page's memory and are never written to storage.</p></div><a href="/">Public site</a></header>
  <section class="panel"><label for="key">Moderator or administrator key</label><input id="key" type="password" autocomplete="off" placeholder="X-Admin-Key"><button id="load">Load reports</button><span id="message" class="muted"></span></section>
  <div class="grid"><section class="panel"><h2>Reports</h2><div id="reports"><p class="muted">Enter a key to load reports.</p></div></section><section class="panel"><h2>Community settings</h2><label for="name">Name</label><input id="name"><label for="description">Description</label><textarea id="description"></textarea><label for="contact">Security contact URL</label><input id="contact"><label><input id="public" type="checkbox" style="width:auto"> Enable public advisories</label><br><button id="save" class="secondary">Save as administrator</button></section></div>
  <script>
    const $=id=>document.getElementById(id);let currentKey='';
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const headers=()=>({'X-Admin-Key':currentKey});
    async function load(){currentKey=$('key').value;const r=await fetch('/api/reports',{headers:headers()});if(!r.ok){$('message').textContent='Access denied or server unavailable.';return}const reports=await r.json();$('message').textContent=`Loaded ${reports.length} report(s).`;$('reports').innerHTML=reports.length?reports.map(report=>`<article class="report"><strong>${esc(report.title)}</strong> <span class="pill">${esc(report.severity)} Â· ${esc(report.status)}</span><p class="muted">${esc(report.serverName)}${report.affectedComponent?' Â· '+esc(report.affectedComponent):''}</p><button data-id="${report.id}" data-status="Acknowledged">Acknowledge</button><button data-id="${report.id}" data-status="Investigating">Investigate</button><button data-id="${report.id}" data-status="Resolved" class="secondary">Resolve</button><button data-id="${report.id}" data-status="Disclosed" class="danger">Disclose</button><button data-audit="${report.id}" class="secondary">Audit</button><pre id="audit-${report.id}" class="muted"></pre></article>`).join(''):'<p class="muted">No reports.</p>';document.querySelectorAll('[data-status]').forEach(button=>button.onclick=()=>update(button.dataset.id,button.dataset.status));document.querySelectorAll('[data-audit]').forEach(button=>button.onclick=()=>audit(button.dataset.audit));}
    async function update(id,status){const r=await fetch(`/api/reports/${id}/status`,{method:'PATCH',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({status})});$('message').textContent=r.ok?`Report moved to ${status}.`:'Update denied.';if(r.ok)load()}
    async function audit(id){const r=await fetch(`/api/reports/${id}/audit`,{headers:headers()});const target=$(`audit-${id}`);target.textContent=r.ok?JSON.stringify(await r.json(),null,2):'Audit unavailable.'}
    async function community(){const r=await fetch('/api/community');if(!r.ok)return;const c=await r.json();$('name').value=c.name;$('description').value=c.description;$('contact').value=c.securityContactUrl??'';$('public').checked=c.publicDisclosureEnabled}
    $('load').onclick=load;$('save').onclick=async()=>{const r=await fetch('/api/community',{method:'PUT',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value,description:$('description').value,securityContactUrl:$('contact').value,publicDisclosureEnabled:$('public').checked})});$('message').textContent=r.ok?'Community settings saved.':'Administrator access required.'};community();
  </script>
</body>
</html>
